<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pet Pals HQ</title><style>*{box-sizing:border-box}body{background:#fdf9f2;color:#263b36;font:16px/1.5 system-ui;margin:0}main{max-width:620px;margin:auto;padding:20px}header,aside{background:#d9efe2;border-radius:20px;padding:18px}h1{color:#256b59}label{display:block;margin:14px 0}input:not([type=checkbox]),select,textarea{display:block;width:100%;font:inherit;padding:12px;border:1px solid #aabdb1;border-radius:10px;background:white}button{background:#256b59;color:white;border:0;border-radius:20px;padding:14px;font:inherit;font-weight:bold;width:100%;margin:8px 0}a{color:#256b59}small{display:block}output{font-size:1.6rem;font-weight:bold}textarea{min-height:80px}</style></head><body><main><a href="playbook.html">← My Pet Pals HQ</a><header><h1>📅 New Booking</h1><p>$10 for 15 minutes · $15 for 30 minutes</p></header><p>Prepare a quote for parent review. This does not confirm a booking or take payment.</p><form id="f" autocomplete="off"><label>Pet name or customer reference<input name="pet" required></label><label>Service<select name="service"><option value="10">Food &amp; fresh water — 15 min</option><option value="10">Little paws walk — 15 min</option><option value="15">Happy paws walk — 30 min</option><option value="15">Play &amp; care — 30 min</option></select></label><label>Number of visits<input name="visits" type="number" min="1" max="30" value="1" required></label><label>Agreed visit dates and times<textarea name="dates" required placeholder="List each visit date and time"></textarea></label><aside>Total: <output id="total">$10.00</output></aside><button>Prepare booking draft</button></form><section id="result" hidden><label>Draft for parent to review and send privately<textarea id="draft" readonly></textarea></label><button id="clear" type="button">Clear all details</button></section><script>const f=document.getElementById('f'),d=document.getElementById('draft'),r=document.getElementById('result'),t=document.getElementById('total');function calc(){t.textContent='$'+(Number(f.elements.service.value)*Number(f.elements.visits.value)).toFixed(2)}f.addEventListener('input',calc);f.addEventListener('submit',e=>{e.preventDefault();calc();d.value='Alice’s Pet Pals — proposed booking (not confirmed)\nPet: '+f.elements.pet.value+'\nService: '+f.elements.service.selectedOptions[0].text+'\nVisits: '+f.elements.visits.value+'\nDates and times: '+f.elements.dates.value+'\nTotal: '+t.textContent+'\nSubject to parental approval, launch readiness, agreed supervision and disclosure of insurance status. Please tell us about any changes to your pet’s health, behaviour or care needs. Payment arrangements and emergency veterinary authorisation to be agreed before confirmation.';r.hidden=false;d.focus()});document.getElementById('clear').onclick=()=>{f.reset();d.value='';r.hidden=true;calc()};</script></main></body></html>
