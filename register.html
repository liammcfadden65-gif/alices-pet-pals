<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pet Pals HQ</title><style>*{box-sizing:border-box}body{background:#fdf9f2;color:#263b36;font:16px/1.5 system-ui;margin:0}main{max-width:620px;margin:auto;padding:20px}header,aside{background:#d9efe2;border-radius:20px;padding:18px}h1{color:#256b59}label{display:block;margin:14px 0}input:not([type=checkbox]),select,textarea{display:block;width:100%;font:inherit;padding:12px;border:1px solid #aabdb1;border-radius:10px;background:white}button{background:#256b59;color:white;border:0;border-radius:20px;padding:14px;font:inherit;font-weight:bold;width:100%;margin:8px 0}a{color:#256b59}small{display:block}output{font-size:1.6rem;font-weight:bold}textarea{min-height:80px}</style></head><body><main><a href="playbook.html">← My Pet Pals HQ</a><header><h1>🐾 New Pet Pal</h1><p>Five-minute meet-and-greet with Mum or Dad.</p></header><p>Draft only. Nothing is sent or saved by this website. Use a parent-controlled device; do not enter keys or access codes.</p><form id="f" autocomplete="off"><label>Owner name<input name="Owner" required></label><label>Contact phone or email<input name="Contact" required></label><label>Service address<input name="Address" required></label><label>Pet names, types and breeds<textarea name="Pets" required></textarea></label><label>Care instructions, health and behaviour<textarea name="Care" required></textarea></label><label>Emergency contact and preferred vet<textarea name="Emergency" required></textarea></label><label><input type="checkbox" name="Customer agreement" value="Confirmed" required> Customer confirms instructions and agrees to emergency veterinary assistance at their expense if necessary.</label><label><input type="checkbox" name="Safety assessment" value="Confirmed" required> Parent assessed pets, property and access as suitable and agreed supervision arrangements.</label><label>Parent reviewing<select name="Parent" required><option value="">Choose</option><option>Amanda</option><option>Liam</option></select></label><button>Prepare registration draft</button></form><section id="result" hidden><label>Private draft — parent to review and transfer to secure records<textarea id="draft" readonly></textarea></label><button id="clear" type="button">Clear all details</button></section><script>const f=document.getElementById('f'),d=document.getElementById('draft'),r=document.getElementById('result');f.addEventListener('submit',e=>{e.preventDefault();d.value='PET PAL REGISTRATION — DRAFT ONLY\n'+Array.from(new FormData(f),([k,v])=>k+': '+v).join('\n');r.hidden=false;d.focus()});document.getElementById('clear').onclick=()=>{f.reset();d.value='';r.hidden=true};</script></main></body></html>
